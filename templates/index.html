<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Processor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f1923;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a2634;
      border-radius: 16px;
      border: 1px solid #253348;
      padding: 40px 44px;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 22px; height: 22px; fill: white; }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #e8f0fe;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #6b8099;
      margin-top: 2px;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #7a9bbf;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      margin-top: 24px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #2d4a6a;
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #0f1923;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #2563eb;
      background: #0d1e30;
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .drop-text {
      color: #8aafc7;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .drop-text span {
      color: #4a90d9;
      font-weight: 600;
    }
    .drop-sub {
      font-size: 0.75rem;
      color: #4a6070;
      margin-top: 4px;
    }

    /* File list */
    .file-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f1923;
      border: 1px solid #253348;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: #a8c4e0;
    }
    .file-item .file-icon { font-size: 1rem; }
    .file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #4a6070; font-size: 1rem;
      padding: 2px 4px; border-radius: 4px;
      transition: color 0.15s;
    }
    .file-item .remove-btn:hover { color: #e05555; }

    /* Date input */
    .date-input {
      width: 100%;
      background: #0f1923;
      border: 1px solid #2d4a6a;
      border-radius: 8px;
      color: #e8f0fe;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .date-input:focus { border-color: #2563eb; }
    .date-input::placeholder { color: #4a6070; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 4px 16px rgba(37,99,235,0.3);
    }
    .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-clear {
      background: #1a2634;
      color: #7a9bbf;
      border: 1px solid #2d4a6a;
    }
    .btn-clear:hover { background: #1f2f40; color: #a8c4e0; border-color: #3d5a75; }

    /* Status */
    .status {
      margin-top: 18px;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.85rem;
      display: none;
      align-items: flex-start;
      gap: 10px;
    }
    .status.show { display: flex; }
    .status.processing { background: #0d1e30; border: 1px solid #1e3a5f; color: #6b9fd4; }
    .status.success { background: #0a1f14; border: 1px solid #1a4028; color: #4ade80; }
    .status.error { background: #1f0e0e; border: 1px solid #4a1a1a; color: #f87171; }

    .spinner {
      width: 16px; height: 16px; min-width: 16px;
      border: 2px solid rgba(107,159,212,0.2);
      border-top-color: #6b9fd4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { line-height: 1.5; }

    /* Progress bar */
    .progress-wrap {
      margin-top: 12px;
      background: #0f1923;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 6px;
      width: 0%;
      transition: width 0.3s;
    }

    .download-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      margin-top: 8px;
    }
    .download-link:hover { color: #93c5fd; }

    .summary-box {
      margin-top: 16px;
      background: #0a1520;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 14px 16px;
      display: none;
    }
    .summary-box.show { display: block; }
    .summary-title { font-size: 0.78rem; font-weight: 600; color: #4a90d9; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .summary-item { }
    .summary-item .s-label { font-size: 0.72rem; color: #4a6070; }
    .summary-item .s-value { font-size: 1rem; font-weight: 700; color: #e8f0fe; margin-top: 1px; }
    .summary-item .s-value.green { color: #4ade80; }
    .summary-item .s-value.blue { color: #60a5fa; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15h8v1H8zm0-3h8v1H8zm0-3h5v1H8z"/>
      </svg>
    </div>
    <div>
      <h1>Inventory Processor</h1>
      <div class="subtitle">Combine, classify, and export inventory reports</div>
    </div>
  </div>

  <div class="section-label">Inventory Files</div>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple accept=".xlsx" />
    <div class="drop-icon">📂</div>
    <div class="drop-text"><span>Click to browse</span> or drag & drop files here</div>
    <div class="drop-sub">Accepts multiple .xlsx inventory files</div>
  </div>
  <div class="file-list" id="fileList"></div>

  <div class="section-label">Month End Date</div>
  <input type="text" class="date-input" id="monthEndDate" placeholder="e.g. 5-31-2026" />

  <div class="btn-row">
    <button class="btn btn-clear" id="clearBtn">✕ Clear</button>
    <button class="btn btn-primary" id="processBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Process & Export
    </button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="status" id="status">
    <div class="spinner" id="statusSpinner"></div>
    <div class="status-text" id="statusText"></div>
  </div>

  <div class="summary-box" id="summaryBox">
    <div class="summary-title">Export Summary</div>
    <div class="summary-grid" id="summaryGrid"></div>
    <a class="download-link" id="downloadLink" href="#" style="display:none">⬇ Download ZIP file</a>
  </div>
</div>

<script>
  let selectedFiles = [];
  let downloadUrl = null;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const processBtn = document.getElementById('processBtn');
  const clearBtn = document.getElementById('clearBtn');
  const monthEndDate = document.getElementById('monthEndDate');
  const status = document.getElementById('status');
  const statusSpinner = document.getElementById('statusSpinner');
  const statusText = document.getElementById('statusText');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const summaryBox = document.getElementById('summaryBox');
  const summaryGrid = document.getElementById('summaryGrid');
  const downloadLink = document.getElementById('downloadLink');

  function updateProcessBtn() {
    processBtn.disabled = selectedFiles.length === 0 || !monthEndDate.value.trim();
  }

  function renderFileList() {
    fileList.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="file-icon">📄</span>
        <span class="file-name">${f.name}</span>
        <button class="remove-btn" data-idx="${i}" title="Remove">✕</button>
      `;
      fileList.appendChild(item);
    });
    fileList.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedFiles.splice(+btn.dataset.idx, 1);
        renderFileList();
        updateProcessBtn();
      });
    });
  }

  function addFiles(newFiles) {
    const existing = new Set(selectedFiles.map(f => f.name));
    for (const f of newFiles) {
      if (f.name.endsWith('.xlsx') && !existing.has(f.name)) {
        selectedFiles.push(f);
        existing.add(f.name);
      }
    }
    renderFileList();
    updateProcessBtn();
  }

  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });

  monthEndDate.addEventListener('input', updateProcessBtn);

  clearBtn.addEventListener('click', () => {
    selectedFiles = [];
    fileInput.value = '';
    monthEndDate.value = '';
    renderFileList();
    updateProcessBtn();
    status.className = 'status';
    summaryBox.className = 'summary-box';
    progressWrap.className = 'progress-wrap';
    if (downloadUrl) { URL.revokeObjectURL(downloadUrl); downloadUrl = null; }
    downloadLink.style.display = 'none';
    downloadLink.href = '#';
  });

  function setStatus(type, text) {
    status.className = `status show ${type}`;
    statusSpinner.style.display = type === 'processing' ? 'block' : 'none';
    statusText.innerHTML = text;
  }

  function animateProgress() {
    let val = 0;
    progressWrap.className = 'progress-wrap show';
    progressBar.style.width = '0%';
    const interval = setInterval(() => {
      val = Math.min(val + Math.random() * 8, 88);
      progressBar.style.width = val + '%';
    }, 200);
    return { interval, complete: () => {
      clearInterval(interval);
      progressBar.style.width = '100%';
      setTimeout(() => progressWrap.className = 'progress-wrap', 800);
    }};
  }

  processBtn.addEventListener('click', async () => {
    const dateVal = monthEndDate.value.trim();
    if (!selectedFiles.length || !dateVal) return;

    const formData = new FormData();
    formData.append('month_end_date', dateVal);
    selectedFiles.forEach(f => formData.append('files', f));

    processBtn.disabled = true;
    setStatus('processing', `Processing ${selectedFiles.length} file(s)…`);
    summaryBox.className = 'summary-box';
    downloadLink.style.display = 'none';

    const prog = animateProgress();

    try {
      const resp = await fetch('/process', { method: 'POST', body: formData });

      if (!resp.ok) {
        prog.complete();
        const err = await resp.json();
        setStatus('error', `❌ ${err.error || 'An error occurred.'}`);
        processBtn.disabled = false;
        return;
      }

      const blob = await resp.blob();
      prog.complete();

      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = URL.createObjectURL(blob);

      // Get summary from headers
      const ysCount = resp.headers.get('X-YS-Rows') || '—';
      const nonYsCount = resp.headers.get('X-NonYS-Rows') || '—';
      const totalCount = resp.headers.get('X-Total-Rows') || '—';

      setStatus('success', `✅ Successfully processed <strong>${selectedFiles.length} file(s)</strong> — export ready!`);

      summaryBox.className = 'summary-box show';
      summaryGrid.innerHTML = `
        <div class="summary-item"><div class="s-label">Total Rows</div><div class="s-value blue">${totalCount}</div></div>
        <div class="summary-item"><div class="s-label">Files Processed</div><div class="s-value blue">${selectedFiles.length}</div></div>
        <div class="summary-item"><div class="s-label">Y&S Rows</div><div class="s-value green">${ysCount}</div></div>
        <div class="summary-item"><div class="s-label">Non Y&S Rows</div><div class="s-value">${nonYsCount}</div></div>
      `;

      downloadLink.href = downloadUrl;
      downloadLink.download = `Inventory - ${dateVal}.zip`;
      downloadLink.style.display = 'inline-flex';

      // Auto-trigger download
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `Inventory - ${dateVal}.zip`;
      a.click();

    } catch (e) {
      prog.complete();
      setStatus('error', `❌ Network error: ${e.message}`);
    }

    processBtn.disabled = false;
    updateProcessBtn();
  });
</script>
</body>
</html>
